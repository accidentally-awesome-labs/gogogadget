name: ci

on:
  push:
    branches: [main]
  pull_request:

# Superseded pushes stop burning runners. Every job below starts in parallel
# (nothing needs anything: each checks out and builds fresh, and no job
# consumes another's artifacts), so the green wall is the slowest job, not the
# sum of two chained ones — measured 24m41s gated, projected 10-11m parallel.
# That trade gives up fail-fast economics: a broken `test` no longer cancels
# seven queued jobs' worth of compute. It favours wall-time anyway, because a
# workflow-level concurrency group with cancel-in-progress reclaims most of
# the waste (a superseded push's whole run stops), and the repo's Definition
# of Done already runs `make check` before every push, so the jobs that start
# early over an about-to-be-superseded commit are bounded by the next push,
# not by the matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    # TEST_DATABASE_URL belongs to THIS job and the `cover` job beside it —
    # the two that run the server suite against it — and no other. It sat at
    # workflow scope and reached all jobs, which matters now that an
    # explicitly named but unreachable server is a `testdb` FAILURE rather
    # than a skip: registry-core and registry-external run with no Postgres
    # service at all, so a closure fixture that ever grows a
    # database-touching test would turn those jobs red over a database
    # nobody asked them for.
    #
    # The six storage/mail variables below are the protocol-container tier.
    # They follow the same rule, and that rule is why they are HERE rather
    # than at workflow scope: naming an endpoint is a REQUEST, so a job that
    # names one with nothing answering on it is a red job, not a skipping one
    # (internal/storage/s3/minio_test.go:requireReachableEndpoint and
    # internal/mail/smtp/mailpit_test.go:requireReachableSMTP, both mirroring
    # internal/db/testdb/testdb.go:103-138).
    #
    # Only this job names them, so only this job runs the tier. `cover` counts
    # those two tests as `[inapplicable]` instead, which the accounted gate
    # never refuses: the claim is "the adapter works against a real server",
    # it is settled once, and a second container pull for coverage numbers
    # over two tests buys nothing. Every value is a key the adapters
    # themselves DECLARE for their minio/mailpit targets, so what CI drives is
    # the documented configuration surface and not a second one invented here.
    #
    # GGG_CONTAINER_DECLARATIONS un-skips the gate over every container any
    # manifest declares (internal/modkit/container_declarations_selfhost_test.go):
    # each pinned digest must resolve at its declared host, and each declared
    # health probe must be runnable in its image and reach exit 0 against a
    # running instance. It belongs to THIS job because this job already has
    # every image it needs on the runner. Measured 19 s warm, 16 s of that
    # registry round-trips; the one extra pull is the manifest-pinned postgres
    # digest (110 MB compressed), which differs from the postgres:16-alpine
    # this job's service container uses.
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gogogadget_test?sslmode=disable
      STORAGE_S3_ENDPOINT: http://localhost:9000
      STORAGE_R2_ACCESS_KEY_ID: minioadmin
      STORAGE_R2_SECRET_ACCESS_KEY: minioadmin
      STORAGE_R2_BUCKET: gogogadget-contract
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      GGG_CONTAINER_DECLARATIONS: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gogogadget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gogogadget_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      # Mailpit is the mail adapter's declared `mailpit` service target,
      # pinned to the SAME digest its manifest declares
      # (registry/modules/system/mail-smtp/module.json) so CI cannot drift
      # onto a different build of the server than a contributor's
      # `ggg services up` would start, and probed with that manifest's own
      # declared health command so a green service here means what a green
      # Compose healthcheck means.
      #
      # Measured cost for the whole tier: 69.5 MB of compressed layers to
      # pull (12.6 MB of it Mailpit, 56.8 MB MinIO, both amd64, read from the
      # registries), 0.29 s and 0.46 s from container start to healthy, and
      # 0.02 s and 0.03 s of test time. That is why this tier is a
      # contributor gate on an existing job instead of an optional job of its
      # own: at well under a minute it is cheaper than the job's own `make
      # setup`, and a tier nobody's PR runs is a tier that rots.
      #
      # MinIO is NOT here, and cannot be. `services` has no `command` key —
      # the runner appends nothing after the image — and the official MinIO
      # image's CMD is bare `minio`, which prints usage and exits, so a MinIO
      # service container can never reach healthy. It is started as a step
      # below instead, same digest, same declared probe. Do not "restore the
      # symmetry" by moving it up here.
      mailpit:
        image: axllent/mailpit@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8025/"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      # The other half of the protocol-container tier. See the `services`
      # comment above for why MinIO cannot be a service container: `services`
      # has no `command` key and this image needs `server /data`.
      #
      # Everything a service container would have given it is here instead
      # and nowhere else: the digest its manifest declares, the root
      # credentials its local_service block declares, the published API port
      # its local_service block declares, and its manifest's own declared
      # health probe polled to a bounded deadline. It runs this early so the
      # pull and the first-start cost overlap nothing later; by the Test step
      # the server has been up for minutes.
      #
      # `--wait` is not used because `docker run` cannot wait on a
      # healthcheck it was not given, and giving the container a healthcheck
      # here would be a second copy of the manifest's. Polling the declared
      # probe from the runner keeps one copy and reports the timeout with the
      # server's own log tail.
      - name: Start MinIO
        run: |
          docker run -d --name ci-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio@sha256:fce0a90a37bb2887c850b68b61a0ac8ac02ea218b58eaea96bb7ca69eb503e20 \
            server /data
          for _ in $(seq 1 40); do
            if docker exec ci-minio mc ready local; then
              exit 0
            fi
            sleep 2
          done
          echo "MinIO never became ready; STORAGE_S3_ENDPOINT names it, so the tier below would fail rather than skip:"
          docker logs ci-minio
          exit 1

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Setup
        run: make setup

      - name: Generate
        run: make generate

      - name: Generated code is committed and fresh
        run: git diff --exit-code -- ':!gogogadget.lock.json'

      - name: Vet
        run: go vet ./...

      # The gate, not a bare `go test`. `go test` never summarises skips, so a
      # package whose every fixture skipped prints the same `ok` as one that
      # passed — which is how an entire integration layer skipped against a
      # torn-down stack and was reported as a pass. `ggg test` reads the event
      # stream, prints the count, and REFUSES a nonzero one here: this job's
      # own env block names TEST_DATABASE_URL and its service container
      # answers on it, so a skip in this job is a test that had everything it
      # asked for and still did not run.
      #
      # Race is this job's half of the split: it is the semantic gate, the
      # detector that proves the concurrent paths actually work. Coverage runs
      # in the parallel `cover` job without race — `--race --cover` in one
      # step was 663 s of this job's 883 s, and the two instrumentations
      # multiply each other's cost for one job's worth of either signal.
      - name: Test
        run: bin/ggg test integration --race

      - name: Build
        run: go build ./...

  # Coverage, the vuln check and the fuzz soak: the `test` job's former other
  # halves. It runs in parallel with `test` — coverage does not need the race
  # detector's verdict, and the race detector does not need coverage's
  # numbers — so neither signal waits on the other's instrumentation cost.
  # It needs the same database, for the same reason `test` does: the
  # accounted suite refuses a skip in CI, and without a reachable
  # TEST_DATABASE_URL every database fixture would skip and fail the job over
  # services this job never started.
  cover:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gogogadget_test?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gogogadget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gogogadget_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Setup
        run: make setup

      - name: Generate
        run: make generate

      - name: Vulnerability check
        run: go tool govulncheck ./...

      # The same accounted gate as the `test` job's Test step, for the same
      # reason — see that step's comment. The only difference is the flag:
      # this job instruments for coverage instead of racing.
      - name: Test with coverage
        run: bin/ggg test integration --cover

      - name: Fuzz
        run: make fuzz

  # Nothing below here needs `test` (or anything else). Every job checks out
  # and builds its own tree — none consumes another job's artifacts; the only
  # artifact steps anywhere in this workflow are failure-report uploads — so
  # a `needs: test` chain bought fail-fast at the price of serialising the
  # whole matrix behind the longest job. They start now, and the concurrency
  # group above reclaims the waste when a push is superseded.
  e2e:
    runs-on: ubuntu-latest
    # The e2e harness derives its database from the project's own test stack
    # (localhost:15432). This job runs no stack: it uses a service container on
    # 5432, so it supplies the address explicitly, which is the precedence
    # layer that exists for exactly this.
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gogogadget_e2e?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gogogadget_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gogogadget_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Setup
        run: make setup

      - name: Install Playwright
        run: cd e2e && npm ci && npx playwright install --with-deps chromium

      - name: E2E
        run: cd e2e && npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  visual:
    runs-on: ubuntu-latest
    # scripts/visual-run.sh pins its own database through VISUAL_DATABASE_URL
    # and falls through to the project's derived test-stack address when it is
    # empty. This job runs no stack: it uses a service container on 5432, so it
    # names that explicitly.
    env:
      VISUAL_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gogogadget_e2e?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gogogadget_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gogogadget_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Setup
        run: make setup

      # make visual owns seeding, the host server on :18080 and the pinned
      # Playwright container. Do not add seed/start-server steps here: a second
      # process would fail to bind :18080, and the baselines only reproduce
      # against the harness that wrote them.
      - name: Visual
        run: make visual

      # A red visual job without the diff images is unactionable — the report
      # carries expected/actual/diff for every changed baseline.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-report
          path: e2e/playwright-report/
          retention-days: 7

  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gogogadget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gogogadget_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Setup
        run: make setup

      - name: Generate
        run: make generate

      - name: Build server
        run: go build -o tmp/server ./cmd/server

      # Blog posts and changelog releases live in content_entries now, not in
      # the binary, so the public surface smoke.sh asserts on (a real post at
      # /blog/hello-world) only exists once the markdown corpus is imported.
      # Seeding is part of standing up the stack, and it exercises the
      # importer in CI as a side effect. -registry dev is the generated
      # module-ordered fragment list; the monolithic testdata .sql files it
      # replaced no longer exist.
      - name: Seed
        run: |
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/gogogadget_test?sslmode=disable" \
            go run ./cmd/seed -registry dev

      - name: Start server
        run: |
          APP_ENV=test PORT=18080 \
            DATABASE_URL="postgres://postgres:postgres@localhost:5432/gogogadget_test?sslmode=disable" \
            DEV_AUTH_BYPASS=true CLERK_PORTAL_URL=https://accounts.example.test \
            TEST_NOW=2026-01-15T00:00:00Z \
            RATE_LIMIT_RPM=100000 \
            ./tmp/server &

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:18080/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "server did not become healthy in 60s"
          exit 1

      - name: Smoke
        run: BASE_URL=http://localhost:18080 ./scripts/smoke.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t gogogadget:ci .

  # `ggg registry validate` is the only gate that proves a module can be
  # installed, compiled, tested, removed, and restored byte for byte. Every
  # other registry check is a statement about data. It runs as two jobs, one
  # per closure family, because they are two different claims: registry-core
  # is this repository's own fixture registry, registry-external is a signed
  # third-party registry resolved through the real path. Split this way a
  # signing or provenance regression cannot be reported as a core fixture
  # failure, and neither family's runtime hides behind the other's.
  #
  # The two jobs never share a work directory. They are separate runners, so
  # separate checkouts — and the harness also suffixes its stable scratch path
  # with the family (modkit.exampleWorkDir), so the same isolation holds when
  # both commands run against one checkout locally.
  #
  # No Postgres service: the closures install, generate, compile, and run their
  # own declared tests inside a throwaway derivative, and none of them touches
  # a database. Adding one would only slow the job down.
  registry-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Setup
        run: make setup

      # Run directly, never through a pipe: the step must fail on the
      # validator's exit code, and its diagnostics are the log.
      - name: Validate core closures
        run: bin/ggg registry validate --closures core

  registry-external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Setup
        run: make setup

      - name: Validate external registry template closures
        run: bin/ggg registry validate --closures external

  # The one gate that runs a real `ggg new` per shipped profile and then
  # `sync --check --offline` inside the created tree. It is its own job for
  # the same reason the two registry-validate jobs are: it needs the network
  # (genesis runs `go mod tidy` in a destination outside this module's tree
  # and installs the pinned Tailwind binary), and `make check` has to stay
  # runnable offline.
  #
  # It costs ~100 s for the four profiles — 93 s of sweep plus the binary
  # build — against a `test` job measured in minutes, so the split is about
  # the network dependency and not about the clock.
  #
  # The profile list is not written here. The test walks catalog.Profiles, so
  # a fifth profile is swept without touching this workflow; only ONE profile
  # was ever exercised end to end before this job existed, which is how three
  # profiles that could not create a project shipped for a release.
  #
  # No Postgres service: genesis writes and generates a tree and never opens a
  # database.
  profiles:
    runs-on: ubuntu-latest
    env:
      GGG_GENESIS_SWEEP: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Setup
        run: make setup

      # -count=1 for the reason the accounted suite uses it: a cached verdict
      # is a report on a run that did not happen, and this test's inputs — the
      # whole registry tree — are not inputs `go test` can observe.
      - name: Every shipped profile creates a sync-clean project
        run: go test -count=1 -run TestEveryShippedProfileCreatesAProjectThatIsSyncClean ./internal/gggcli -v
