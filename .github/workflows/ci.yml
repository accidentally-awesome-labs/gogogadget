name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gogogadget_test?sslmode=disable

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gogogadget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gogogadget_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Setup
        run: make setup

      - name: Generate
        run: make generate

      - name: Generated code is committed and fresh
        run: git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Vulnerability check
        run: go tool govulncheck ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Fuzz
        run: make fuzz

      - name: Build
        run: go build ./...

  e2e:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gogogadget_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gogogadget_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Setup
        run: make setup

      - name: Install Playwright
        run: cd e2e && npm ci && npx playwright install --with-deps chromium

      - name: E2E
        run: cd e2e && npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  smoke:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gogogadget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gogogadget_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Setup
        run: make setup

      - name: Generate
        run: make generate

      - name: Build server
        run: go build -o tmp/server ./cmd/server

      - name: Start server
        run: |
          APP_ENV=test PORT=18080 \
            DATABASE_URL="postgres://postgres:postgres@localhost:5432/gogogadget_test?sslmode=disable" \
            DEV_AUTH_BYPASS=true CLERK_PORTAL_URL=https://accounts.example.test \
            TEST_NOW=2026-01-15T00:00:00Z \
            RATE_LIMIT_RPM=100000 \
            ./tmp/server &

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:18080/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "server did not become healthy in 60s"
          exit 1

      - name: Smoke
        run: BASE_URL=http://localhost:18080 ./scripts/smoke.sh

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t gogogadget:ci .
