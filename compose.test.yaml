name: gogogadget-test
services:
    app:
        build: .
        env_file:
            - .ggg/env/test.env
        ports:
            - 8080:8080
        environment:
            APP_ENV: test
            APP_URL: http://localhost:8080
            DATABASE_URL: postgres://postgres:postgres@ggg-system-database-postgres-docker-postgres:5432/gogogadget?sslmode=disable
        depends_on:
            ggg-system-database-postgres-docker-postgres:
                condition: service_healthy
    ggg-system-database-postgres-docker-postgres:
        image: postgres@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: gogogadget
        volumes:
            - ggg-system-database-postgres-docker-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U postgres
            interval: 2s
            timeout: 2s
            retries: 30
volumes:
    ggg-system-database-postgres-docker-postgres-data: {}
