services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gogogadget
    ports:
      # Host port is overridable for machines where 5432 is taken by another
      # Postgres: set DB_PORT (e.g. 5433) in .env and match DATABASE_URL.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gogogadget"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/gogogadget?sslmode=disable
      APP_URL: ${APP_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
