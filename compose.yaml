services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gogogadget
    ports:
      # Host port is overridable for machines where 5432 is taken by another
      # Postgres: set DB_PORT (e.g. 5433) in .env and match DATABASE_URL.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gogogadget"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
