root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/server"
  cmd = "go build -o ./tmp/server ./cmd/server"
  # ggg dev owns the templ and Tailwind watchers. Air only rebuilds/restarts
  # the Go server, so no watcher can spawn a second copy of another watcher.
  pre_cmd = []
  include_ext = ["go", "templ"]
  exclude_dir = ["tmp", "bin", "e2e", "static/vendor", "content"]
  exclude_regex = ["_templ.go", "_test.go"]
  delay = 300
  stop_on_error = true

[misc]
  clean_on_exit = true
